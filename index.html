<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #261311;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: #c3955b;
            font-size: 36px;
            text-align: center;
            margin-bottom: 25px;
        }

        body>div {
            width: 100%;
            max-width: 450px;
            background-color: #321b17;
            padding: 25px;
            border: 1px solid #674633;
            border-radius: 15px;
        }

        label {
            display: block;
            color: #c3955b;
            font-size: 15px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #261311;
            color: white;
            border: 1px solid #c3955b;
            border-radius: 8px;
            outline: none;
        }

        button {
            padding: 12px 15px;
            background-color: #c3955b;
            color: #261311;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #addTask {
            width: 100%;
            margin-bottom: 15px;
        }

        button:hover {
            background-color: #d5ac78;
        }

        #list {
            list-style: none;
        }

        .main {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            background-color: #43271f;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            width: 100%;
        }

        .main li {
            color: white;
            overflow-wrap: anywhere;
            word-break: break-word;
            flex: 1;
            min-width: 0;
        }

        .main li+div {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        .main button {
            flex-shrink: 0;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 28px;
            }

            body>div {
                padding: 18px;
            }

            .main {
                padding: 10px;
                gap: 7px;
            }

            .main button {
                padding: 9px;
            }
        }

        .main button {
            padding: 9px 12px;
            transition: 0.3s;
        }

        .main button:first-child {
            background-color: #c3955b;
        }

        .main button:last-child {
            background-color: #b94b4b;
            color: white;
        }

        .main button:hover {
            opacity: 0.8;
        }

        @media (max-width: 380px) {
            .main {
                flex-wrap: wrap;
            }

            .main li {
                width: 100%;
            }

            .main li+div {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>To do application</h1>
    <div>
        <label>Enter your task <input type="text" id="task" /></label>
        <button id="addTask">Add Task</button>
        <ul id="list">

        </ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
